name: Bot restock TCG

on:
  workflow_dispatch:
  schedule:
    # Filet de sécurité seulement : chaque exécution déclenche normalement la
    # suivante. Les minutes évitent le pic de charge du début d'heure.
    - cron: "13,43 * * * *"

# Une exécution active et, au maximum, la plus récente en attente. Les anciens
# déclenchements en attente sont remplacés, ce qui évite une file obsolète.
concurrency:
  group: restock
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Récupérer le dernier état
        uses: actions/checkout@v4
        with:
          # Un run planifié peut avoir attendu plusieurs heures. On récupère
          # explicitement la branche à jour au lieu de son ancien SHA.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Tester la v10
        run: python -m unittest -v

      - name: Surveiller les boutiques
        id: bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          PYTHONUNBUFFERED: "1"
        run: python -u restock_bot.py

      - name: Sauvegarder l'état final
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add etat_stock.json
          git diff --cached --quiet && exit 0
          git commit -m "etat v10 fin workflow - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --quiet origin
          git push --quiet origin HEAD

      - name: Déclencher la relève
        if: always() && steps.bot.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESTOCK_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run restock.yml --ref "$RESTOCK_BRANCH"
